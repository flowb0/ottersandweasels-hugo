<header class="site-header">
  <div class="header-bg">
    <div class="header-content">
      {{- /* Home page H1 = the logo (alt text carries the name); inner pages use the post title as H1. */ -}}
      {{ if .IsHome }}<h1 class="logo-h1">{{ end }}
      <a href="/" class="logo-link">
        <img src="{{ .Site.Params.headerImage }}" alt="{{ .Site.Title }}" class="header-logo">
      </a>
      {{ if .IsHome }}</h1>{{ end }}
    </div>
  </div>
  <nav class="main-nav">
    <div class="container">
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </div>
  </nav>
</header>
